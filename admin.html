<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gloryland Connect | Admin</title><style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--fg);--bg:#f3f5f9;--fg:#17243a;--panel:white;--line:#dce2eb}body.dark{--bg:#101828;--fg:#e9eef8;--panel:#1c293d;--line:#34445d}header{background:#101828;color:white;padding:22px;display:flex;justify-content:space-between;align-items:center;gap:12px}small{opacity:.75}main{max-width:1200px;margin:auto;padding:24px}section,.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px}#login{max-width:420px;margin:10vh auto}input,select,button,textarea{font:inherit;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--fg)}button{cursor:pointer}button.primary{background:#14795d;color:white;border:0}nav,.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.tile strong{display:block;font-size:30px;margin-top:10px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}label{display:block;margin:10px 0}label input,label textarea{display:block;width:100%}dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:16px;width:min(550px,94vw);max-height:90vh;overflow:auto}h1,h2{margin:0 0 12px}#msg{color:#b45309;white-space:pre-wrap}.bar{height:9px;background:#159675;border-radius:9px;margin:6px 0 14px} [hidden]{display:none!important}</style><style>
:root{font-family:Inter,system-ui,sans-serif}body{--bg:#f5f7fb;--fg:#19283e;--panel:#fff;--line:#e4e9f1}body.dark{--bg:#0c1423;--panel:#172235;--fg:#edf3ff;--line:#2a3950}header{height:76px;padding:16px 30px;background:#111e35;box-shadow:0 4px 20px #0001}header b{letter-spacing:2px;font-size:14px}header small{font-size:11px}header button{background:#ffffff12;color:white;border-color:#ffffff30}main{max-width:none;padding:30px}#login{position:relative;margin:8vh auto;max-width:460px;padding:42px;border-radius:24px;box-shadow:0 24px 80px #152c4820}#login:before{content:'GC';display:grid;place-items:center;width:64px;height:64px;border-radius:20px;background:#13775d;color:white;font-weight:800;font-size:24px;margin-bottom:28px}#login h1{font-size:30px;letter-spacing:-1px}#login p{opacity:.65;margin-bottom:28px}#login input{margin-top:8px;padding:15px}#login .primary{width:100%;padding:15px;margin-top:14px;font-weight:650}body:has(#login:not([hidden])){background:radial-gradient(ellipse at 15% 85%,#13876b25,transparent 45%),radial-gradient(ellipse at 85% 20%,#4369a125,transparent 45%),var(--bg)}#app{display:grid;grid-template-columns:225px minmax(0,1fr);gap:28px;align-items:start}#nav{position:sticky;top:20px;display:flex;flex-direction:column;flex-wrap:nowrap;background:#111e35;padding:18px;border-radius:18px;min-height:calc(100vh - 140px);gap:8px}#nav:before{content:'WORKSPACE';font-size:10px;letter-spacing:2px;color:#9eafc7;padding:12px}#nav button{background:transparent;color:#c8d5e8;border:0;text-align:left;padding:14px 12px;font-weight:550}#nav button:hover,#nav button.active{background:#ffffff16;color:white}#nav button.active{box-shadow:inset 3px 0 #47d5ac}#logout{margin-top:auto;color:#f4b7b7!important}#view h1{font-size:28px;letter-spacing:-.8px;margin:0 0 24px}#view h2{font-size:17px;letter-spacing:-.3px}section,.tile{box-shadow:0 4px 16px #14253c06;border-radius:18px}.tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:10px}.tile{padding:22px;font-size:13px;position:relative;overflow:hidden}.tile:after{content:'';position:absolute;width:75px;height:75px;border-radius:50%;right:-20px;top:-20px;background:#1a987715}.tile strong{font-size:34px;letter-spacing:-1px;color:#168768}body.dark .tile strong{color:#5ad9b1}th{font-size:11px;text-transform:uppercase;letter-spacing:.6px;background:var(--bg)}td{font-size:13px}button{transition:background .15s}button:hover{filter:brightness(.96)}#collapse{font-size:18px}body.compact #app{grid-template-columns:76px minmax(0,1fr)}body.compact #nav{padding:10px}body.compact #nav:before{content:'GC';text-align:center;padding:8px}body.compact #nav button{font-size:0;text-align:center}body.compact #nav button:before{content:attr(data-short);font-size:15px}#msg:not(:empty){padding:12px 16px;background:var(--panel);border-radius:10px} @media(max-width:800px){main{padding:16px}#app,body.compact #app{grid-template-columns:1fr;gap:12px}#nav{position:static;min-height:0;flex-direction:row;overflow:auto;padding:8px}#nav:before{display:none}#nav button{white-space:nowrap;padding:10px}#logout{margin-top:0}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}header{padding:12px 16px}#login{margin:5vh auto;padding:28px}}
</style>
<header><div><b>GLORYLAND CONNECT</b><br><small>RCCG Gloryland Assembly · Administration</small></div><div><button id="collapse" aria-label="Toggle sidebar">☰</button> <button id="theme">Light / Dark</button></div></header><main><section id="login"><h1>Welcome back</h1><p>Sign in to manage guest records.</p><form id="auth"><label>Administrator password<input id="pw" type="password" required autocomplete="current-password"></label><button class="primary">Sign in</button></form></section><p id="msg" role="status"></p><div id="app" hidden><nav id="nav"></nav><div id="view"></div></div></main><dialog id="edit"><form id="editForm"><h2>Guest profile</h2><div id="fields"></div><button class="primary">Save changes</button> <button type="button" id="close">Close</button></form></dialog><script>
const $=id=>document.getElementById(id);let guests=[],page='Overview',selected=null,query='',status='',month='';const months=['January','February','March','April','May','June','July','August','September','October','November','December'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Lagos',day:'numeric',month:'long'}).format(new Date());const birthday=g=>g['Birth Day']+' '+g['Birth Month'];const yes=(g,k)=>g[k]==='Yes';const message=s=>$('msg').textContent=s;
async function api(action,extra={}){const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Request failed');return d}
async function load(){const d=await api('list');guests=d.guests||[];$('login').hidden=true;$('app').hidden=false;render()}
$('auth').onsubmit=async e=>{e.preventDefault();message('Signing in…');try{await api('login',{password:$('pw').value});$('pw').value='';await load();message('')}catch(e){message(e.message)}};
$('theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('gl-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('gl-theme')==='dark')document.body.classList.add('dark');
const tabs=['Overview','Guests','Birthdays','Follow-up','Analytics'];$('nav').innerHTML=tabs.map(t=>'<button data-tab="'+t+'">'+t+'</button>').join('')+'<button id="refresh">Refresh</button><button id="logout">Sign out</button>';$('nav').onclick=async e=>{if(e.target.dataset.tab){page=e.target.dataset.tab;query='';status='';render()}if(e.target.id==='refresh'){try{await load();message('Updated')}catch(e){message(e.message)}}if(e.target.id==='logout'){try{await api('logout')}finally{location.reload()}}};
function tile(n,v){return '<div class="tile">'+esc(n)+'<strong>'+esc(v)+'</strong></div>'}
function table(rows,cols){return '<div class="scroll"><table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th>Action</th></tr></thead><tbody>'+rows.map(g=>'<tr>'+cols.map(c=>'<td>'+esc(g[c])+'</td>').join('')+'<td><button data-row="'+guests.indexOf(g)+'">View / edit</button></td></tr>').join('')+'</tbody></table></div>'}
function chart(key){let counts={};guests.forEach(g=>{let k=g[key]||'Not specified';counts[k]=(counts[k]||0)+1});return '<section><h2>'+esc(key)+'</h2>'+Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+' · '+v+'<div class="bar" style="width:'+100*v/Math.max(1,guests.length)+'%"></div>').join('')+'</section>'}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===page));let v=$('view');if(page==='Overview'){v.innerHTML='<h1>Dashboard overview</h1><div class="tiles">'+tile('Total guests',guests.length)+tile('First-time visitors',guests.filter(g=>yes(g,'First Visit')).length)+tile('Returning visitors',guests.filter(g=>g['First Visit']==='No').length)+tile('Membership interest',guests.filter(g=>yes(g,'Membership Interest')).length)+tile('Birthdays today',guests.filter(g=>birthday(g)===today).length)+tile('New follow-ups',guests.filter(g=>g['Follow-up Status']==='New').length)+'</div><section><h2>Recent registrations</h2>'+table(guests.slice(-10).reverse(),['Full Name','Date Received','Follow-up Status'])+'</section>';return}
if(page==='Analytics'){v.innerHTML=chart('Referral Source')+chart('Gender')+chart('Age Range')+chart('Membership Interest')+chart('Follow-up Status');return}
if(page==='Birthdays'){let rows=guests.filter(g=>g['Birth Month']&&g['Birth Day']&&(!month||g['Birth Month']===month)).sort((a,b)=>months.indexOf(a['Birth Month'])-months.indexOf(b['Birth Month'])||Number(a['Birth Day'])-Number(b['Birth Day']));v.innerHTML='<h1>Birthday calendar</h1><section><h2>Today</h2>'+table(guests.filter(g=>birthday(g)===today),['Full Name','Birth Day','Birth Month'])+'</section><section><select id="month"><option value="">All months</option>'+months.map(m=>'<option '+(m===month?'selected':'')+'>'+m+'</option>').join('')+'</select>'+table(rows,['Full Name','Birth Day','Birth Month','Phone / WhatsApp'])+'</section>';$('month').onchange=e=>{month=e.target.value;render()};return}
v.innerHTML='<h1>'+page+'</h1><section><div class="tools"><input id="search" placeholder="Search name or phone" value="'+esc(query)+'"><select id="status"><option value="">All statuses</option>'+[...new Set(guests.map(g=>g['Follow-up Status']).filter(Boolean))].map(s=>'<option '+(s===status?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select><button id="csv">Export CSV / Excel</button></div><div id="results"></div></section>';function filter(){let rows=guests.filter(g=>[g['Full Name'],g['Phone / WhatsApp'],g['Submission ID']].join(' ').toLowerCase().includes(query.toLowerCase())&&(!status||g['Follow-up Status']===status));$('results').innerHTML=table(rows,page==='Follow-up'?['Full Name','Follow-up Consent','Follow-up Status','Assigned To','Last Contact Date']:['Full Name','Phone / WhatsApp','Email Address','Follow-up Status']);return rows}$('search').oninput=e=>{query=e.target.value;filter()};$('status').onchange=e=>{status=e.target.value;filter()};$('csv').onclick=()=>{let rows=filter(),keys=['Submission ID','Full Name','Phone / WhatsApp','Email Address','Birth Day','Birth Month','Follow-up Status','Assigned To'];let cell=x=>'"'+String(x??'').replace(/^[=+@\-\t\r]/,"'$&").replace(/"/g,'""')+'"';let url=URL.createObjectURL(new Blob(['\ufeff'+[keys,...rows.map(g=>keys.map(k=>g[k]))].map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv'}));let a=document.createElement('a');a.href=url;a.download='gloryland-guests.csv';a.click();URL.revokeObjectURL(url)};filter()}
$('view').onclick=e=>{if(e.target.dataset.row===undefined)return;selected=guests[Number(e.target.dataset.row)];$('fields').innerHTML=['Full Name','Preferred Name','Phone / WhatsApp','Email Address','Follow-up Status','Assigned To','Last Contact Date','Follow-up Notes'].map(k=>'<label>'+esc(k)+'<input name="'+esc(k)+'" value="'+esc(selected[k])+'"></label>').join('');$('edit').showModal()};$('close').onclick=()=>$('edit').close();$('editForm').onsubmit=async e=>{e.preventDefault();try{await api('update',{id:selected['Submission ID'],updates:Object.fromEntries(new FormData(e.target))});$('edit').close();await load();message('Saved successfully')}catch(e){message(e.message);alert(e.message)}};$('collapse').onclick=()=>document.body.classList.toggle('compact');document.querySelectorAll('#nav button').forEach((b,i)=>b.dataset.short=['OV','GU','BD','FU','AN','↻','↪'][i]);load().catch(()=>{});
</script></html>
